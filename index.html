<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>발권기</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f7f7;font-family:Arial,"Noto Sans KR",sans-serif;color:#222}
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.panel{width:min(1100px,96vw);min-height:650px;background:white;border-radius:28px;box-shadow:0 8px 35px #0002;padding:45px;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1{font-size:48px;margin:0 0 12px}
.sub{font-size:22px;color:#666;margin-bottom:45px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:28px;width:min(850px,90%)}
.choice{border:0;border-radius:24px;padding:55px 25px;background:#eee;cursor:pointer;transition:.15s;font-size:34px;font-weight:800}
.choice:hover{transform:translateY(-3px);box-shadow:0 10px 25px #0002}
.choice.free{background:#dffcff;color:#087f87}
.choice.normal{background:#eee;color:#333}
.icon{font-size:70px;display:block;margin-bottom:18px}
.page{display:none;width:100%;text-align:center}
.page.active{display:block}
.back{position:absolute;top:25px;left:25px;border:0;background:#eee;border-radius:12px;padding:12px 18px;font-size:18px;cursor:pointer}
.nextbox{margin-top:35px;font-size:28px}
@media(max-width:700px){.choices{grid-template-columns:1fr}.panel{padding:25px;min-height:90vh}h1{font-size:36px}.choice{padding:38px 20px;font-size:27px}}
</style>
</head>
<body>
<div class="screen">
  <main class="panel">
    <section id="home" class="page active">
      <h1>관람 방법을 선택해주세요</h1>
      <div class="sub">원하는 방법을 눌러주세요</div>
      <div class="choices">
        <button class="choice free" onclick="showPage('free')">
          <span class="icon">🎫</span>
          자유선택
        </button>
        <button class="choice normal" onclick="showPage('normal')">
          <span class="icon">👀</span>
          그냥 관람
        </button>
      </div>
    </section>

    <section id="free" class="page">
      <button class="back" onclick="showPage('home')">← 뒤로</button>
      <h1>자유선택</h1>
      <div class="sub">자유선택 메뉴가 나오는 화면</div>
      <div class="nextbox">여기에 티켓 종류와 수량 선택 화면을 넣을 수 있어.</div>
    </section>

    <section id="normal" class="page">
      <button class="back" onclick="showPage('home')">← 뒤로</button>
      <h1>그냥 관람</h1>
      <div class="sub">일반 관람 발권 화면</div>
      <div class="nextbox">여기에 바로 관람권을 발권하는 화면을 넣을 수 있어.</div>
    </section>
  </main>
</div>
<script>
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
</script>
</body>
</html>
